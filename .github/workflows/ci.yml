name: CI

# 每次推送到 main：lint、单元测试、构建签名的 release APK，并自动发布到 GitHub Releases
# （标签 v1.0.<Git 提交数>）。App 内的自动更新从这里下载新版本（docs/design.md §13）。
# 签名文件来自仓库的 Settings → Secrets：
#   KEYSTORE_BASE64  签名文件（.jks）的 base64
#   STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# Pull Request 只构建和测试，不发布（拿不到 Secrets，用 debug 签名）。
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "fastlane/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 版本号 = Git 提交数，需要完整历史

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "JEEK_STOREFILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, unit tests, release build
        env:
          JEEK_STOREPASSWORD: ${{ secrets.STORE_PASSWORD }}
          JEEK_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          JEEK_KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Prepare release
        if: env.PUBLISH == 'true'
        run: |
          count=$(git rev-list --count HEAD)
          echo "VERSION=1.0.$count" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "JeekMusic-1.0.$count.apk"
          # 更新说明：上一个版本之后的所有提交标题
          last=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$last" ]; then range="$last..HEAD"; else range="-1"; fi
          git log --no-merges --pretty='- %s' $range > release-notes.md

      - uses: softprops/action-gh-release@v3
        if: env.PUBLISH == 'true'
        with:
          tag_name: v${{ env.VERSION }}
          name: JeekMusic ${{ env.VERSION }}
          body_path: release-notes.md
          files: JeekMusic-${{ env.VERSION }}.apk
          make_latest: true
