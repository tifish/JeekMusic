name: Release

# 推送 v* 标签时构建签名的 release APK 并发布到 GitHub Releases。
# 需要在仓库的 Settings → Secrets 中配置：
#   KEYSTORE_BASE64  签名文件（.jks）的 base64
#   STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build release APK
        env:
          JEEK_STOREFILE: release.jks
          JEEK_STOREPASSWORD: ${{ secrets.STORE_PASSWORD }}
          JEEK_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          JEEK_KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "JeekMusic-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          files: JeekMusic-${{ github.ref_name }}.apk
          generate_release_notes: true
