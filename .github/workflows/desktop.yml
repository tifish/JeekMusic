name: Desktop

# 桌面端（desktop/，Windows）。每次推送到 main 且改动了 desktop/ 或 shared/：单元测试、Native AOT 发布、打包 zip，
# 发布到 GitHub Releases（标签 desktop-v1.0.<Git 提交数>）。桌面端的程序内更新从这里下载新版本（desktop/docs/design.md §15）。
# **不能成为 latest**：移动端的应用内更新取的是 releases/latest（mobile/docs/design.md §13.2）。
# Pull Request 只构建和测试，不发布。
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "!desktop/docs/**"
      - "!desktop/**.md"
      - "!desktop/spike/**"
      - "!desktop/spike-audio/**"
      - "shared/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths: ["desktop/**", "shared/**", ".github/workflows/desktop.yml"]
  workflow_dispatch: # 在 Actions 页面手动运行（也会发布）

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 版本号 = Git 提交数，需要完整历史

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: |
          count=$(git rev-list --count HEAD)
          echo "VERSION=1.0.$count" >> "$GITHUB_ENV"

      # 发布必须携带自编译的 LGPL 内核；下载或校验失败时停止构建。
      - name: libmpv (LGPL)
        run: bash desktop/tools/get-libmpv.sh --lgpl
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test
        env:
          # New fixtures use the runner's scratch volume, without legacy DOS aliases.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python desktop/tools/test_build_workflow.py
          dotnet test desktop/JeekMusic.slnx -c Release

      - name: Publish (Native AOT)
        run: |
          # ILCompiler 链接时要用 vswhere 找 MSVC
          export PATH="$PATH:/c/Program Files (x86)/Microsoft Visual Studio/Installer"
          dotnet publish desktop/src/JeekMusic.App/JeekMusic.App.csproj -c Release -r win-x64 \
            -p:JeekVersion=$VERSION -o publish/JeekMusic
          assets=$(dotnet msbuild desktop/src/JeekMusic.App/JeekMusic.App.csproj -nologo \
            -p:_IsPublishing=true -p:Configuration=Release -p:RuntimeIdentifier=win-x64 -getProperty:ProjectAssetsFile | tr -d '\r')
          python desktop/tools/collect-licenses.py publish/JeekMusic --assets "$assets"
          rm -f publish/JeekMusic/*.pdb
          ls -la publish/JeekMusic

      - name: Build isolation and real EXE/MCP round trips
        # Hosted Windows VMs need not have a WASAPI endpoint; still launch every EXE.
        run: |
          python desktop/tools/test-build-isolation.py --startup-only --published-exe publish/JeekMusic/JeekMusic.exe
          python desktop/tools/test-smart-tags-mcp.py --exe output/JeekMusic.exe
          python desktop/tools/test-smart-tags-mcp.py --exe publish/JeekMusic/JeekMusic.exe

      - name: Package
        run: |
          cp LICENSE publish/JeekMusic/LICENSE.txt
          cd publish
          7z a -tzip "../JeekMusic-desktop-$VERSION-win-x64.zip" JeekMusic > /dev/null
          cd ..
          ls -la *.zip

      - uses: actions/upload-artifact@v7
        with:
          name: JeekMusic-desktop
          path: JeekMusic-desktop-*.zip

      - name: Release notes
        if: env.PUBLISH == 'true'
        run: |
          # 上一个桌面端版本之后改动了 desktop/ 或 shared/ 的提交标题
          last=$(git describe --tags --abbrev=0 --match 'desktop-v*' HEAD 2>/dev/null || true)
          if [ -n "$last" ]; then range="$last..HEAD"; else range="-20"; fi
          git log --no-merges --pretty='- %s' $range -- desktop shared > release-notes.md


      - uses: softprops/action-gh-release@v3
        if: env.PUBLISH == 'true'
        with:
          tag_name: desktop-v${{ env.VERSION }}
          name: Jeek Music 桌面端 ${{ env.VERSION }}
          body_path: release-notes.md
          files: JeekMusic-desktop-${{ env.VERSION }}-win-x64.zip
          make_latest: false
